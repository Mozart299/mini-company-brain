version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  store-1:
    build: { context: ., dockerfile: Dockerfile.store }
    environment:
      NODE_ID: store-1
      PORT: "7001"
      DATA_DIR: /data
    volumes:
      - store-1-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7001/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  store-2:
    build: { context: ., dockerfile: Dockerfile.store }
    environment:
      NODE_ID: store-2
      PORT: "7002"
      DATA_DIR: /data
    volumes:
      - store-2-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7002/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  store-3:
    build: { context: ., dockerfile: Dockerfile.store }
    environment:
      NODE_ID: store-3
      PORT: "7003"
      DATA_DIR: /data
    volumes:
      - store-3-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7003/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingestion:
    build: { context: ., dockerfile: Dockerfile.ingestion }
    environment:
      REDIS_ADDR: redis:6379
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-owner/repo}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      LINEAR_TEAM_ID: ${LINEAR_TEAM_ID:-}
    depends_on:
      redis:
        condition: service_healthy

  coordinator:
    build: { context: ., dockerfile: Dockerfile.coordinator }
    environment:
      REDIS_ADDR: redis:6379
      STORE_NODES: store-1:7001,store-2:7002,store-3:7003
    depends_on:
      redis:
        condition: service_healthy
      store-1:
        condition: service_healthy
      store-2:
        condition: service_healthy
      store-3:
        condition: service_healthy

  api:
    build: { context: ., dockerfile: Dockerfile.api }
    environment:
      PORT: "8080"
      REDIS_ADDR: redis:6379
      STORE_NODES: store-1:7001,store-2:7002,store-3:7003
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      store-1:
        condition: service_healthy
      store-2:
        condition: service_healthy
      store-3:
        condition: service_healthy

  web:
    build: { context: ., dockerfile: Dockerfile.web }
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  store-1-data:
  store-2-data:
  store-3-data:
