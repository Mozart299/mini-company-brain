version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  store-1:
    build:
      context: .
      dockerfile: Dockerfile.store
    environment:
      NODE_ID: "store-1"
      PORT: "7001"
      DATA_DIR: "/data/store-1"
      PEERS: "store-2:7002,store-3:7003"
    ports:
      - "7001:7001"
    depends_on:
      redis:
        condition: service_healthy

  store-2:
    build:
      context: .
      dockerfile: Dockerfile.store
    environment:
      NODE_ID: "store-2"
      PORT: "7002"
      DATA_DIR: "/data/store-2"
      PEERS: "store-1:7001,store-3:7003"
    ports:
      - "7002:7002"
    depends_on:
      redis:
        condition: service_healthy

  store-3:
    build:
      context: .
      dockerfile: Dockerfile.store
    environment:
      NODE_ID: "store-3"
      PORT: "7003"
      DATA_DIR: "/data/store-3"
      PEERS: "store-1:7001,store-2:7002"
    ports:
      - "7003:7003"
    depends_on:
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PORT: "8080"
      REDIS_ADDR: "redis:6379"
      STORE_NODES: "store-1:7001,store-2:7002,store-3:7003"
    ports:
      - "8080:8080"
    depends_on:
      - store-1
      - store-2
      - store-3

  coordinator:
    build:
      context: .
      dockerfile: Dockerfile.coordinator
    environment:
      REDIS_ADDR: "redis:6379"
      STORE_NODES: "store-1:7001,store-2:7002,store-3:7003"
    depends_on:
      - store-1
      - store-2
      - store-3
